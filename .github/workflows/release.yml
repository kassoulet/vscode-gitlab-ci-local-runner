name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check publishing token is available
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "${VSCE_PAT//[[:space:]]/}" ]; then
            echo "::error::VSCE_PAT is empty in this job. vsce would fail with 'TF400813: The user aaaaaaaa-... is not authorized', which hides the real cause. Check that VSCE_PAT is a repository-level Actions secret, that it is not an environment, Dependabot or Codespaces secret, and that this run started after it was saved."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Read package version
        id: pkg
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "VSIX name: gitlab-ci-local-runner-$version.vsix"

      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Tag '$TAG' does not match the version in package.json ('$VERSION'). vsce always publishes the package.json version, so this tag would release the wrong version. Bump package.json or push a tag that matches it."
            exit 1
          fi

      - name: Package extension
        run: npm run package

      - name: Upload VSIX
        uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: gitlab-ci-local-runner-${{ steps.pkg.outputs.version }}.vsix

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Upload Release Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: gitlab-ci-local-runner-${{ steps.pkg.outputs.version }}.vsix
          asset_name: gitlab-ci-local-runner-${{ steps.pkg.outputs.version }}.vsix
          asset_content_type: application/vsix

      - name: Publish to Visual Studio Marketplace
        run: npm run publish:vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # - name: Publish to Open VSX Registry
      #   run: npm run publish:ovsx
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
